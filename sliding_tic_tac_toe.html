<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理スライド四目並べ (4x4 Tic-Tac-Toe)</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --board-bg: #2d3748;
            --cell-bg: #edf2f7;
            --player-o: #4299e1;
            --player-x: #f56565;
            --inner-color: #e2e8f0;
            --cell-size: 80px;
            --gap-size: 8px;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #1a202c;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        #status {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            height: 1.5rem;
        }
        .board-container {
            background-color: var(--board-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden; /* マスが外にはみ出ないようにする */
        }
        .board {
            display: grid;
            grid-template-columns: repeat(4, var(--cell-size));
            grid-template-rows: repeat(4, var(--cell-size));
            gap: var(--gap-size);
            position: relative;
        }
        .cell {
            background-color: var(--cell-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            /* transformはJavaScriptで直接操作します */
        }
        .cell[data-inner="true"] {
            background-color: var(--inner-color);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        /* ホバーアクションはアニメーション中以外に適用 */
        .cell:not(.animating):hover {
            transform: scale(0.95);
        }
        .cell.O { color: var(--player-o); }
        .cell.X { color: var(--player-x); }
        
        .reset-btn {
            margin-top: 2rem;
            padding: 10px 24px;
            font-size: 1.1rem;
            background-color: var(--board-bg);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .reset-btn:hover {
            background-color: #4a5568;
        }
        
        .description {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #4a5568;
            text-align: center;
            max-width: 420px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>🔄 うごく〇×げーむ</h1>
    <div id="status">Player O の番です</div>

    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <button class="reset-btn" onclick="initGame()">もういちど</button>

    <div class="description">
        ルール: 1手打つごとに、真ん中4マスは時計回りに、外側12マスは反時計回りに<strong>マスごとスライド</strong>して移動します。<br>
        移動後に縦・横・斜めのいずれかに4つ揃うと勝利です。
    </div>

    <script>
        let board = [];
        let currentPlayer = 'O';
        let gameOver = false;
        let isAnimating = false;

        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');

        // 移動距離 (セルサイズ 80px + ギャップ 8px = 88px)
        const MOVE_UNIT = 88;

        function initGame() {
            board = Array(4).fill(null).map(() => Array(4).fill(''));
            currentPlayer = 'O';
            gameOver = false;
            isAnimating = false;
            updateStatus();
            renderBoard();
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = board[r][c];
                    if (board[r][c] !== '') cell.classList.add(board[r][c]);
                    
                    if ((r === 1 || r === 2) && (c === 1 || c === 2)) {
                        cell.dataset.inner = "true";
                    } else {
                        cell.dataset.inner = "false";
                    }

                    // 位置情報を保存（クリックとアニメーション計算用）
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    cell.onclick = () => handleCellClick(r, c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if (gameOver || isAnimating || board[r][c] !== '') return;

            board[r][c] = currentPlayer;
            renderBoard(); // まず石を置いた状態を画面に反映
            isAnimating = true;

            // 少しだけ待ってからスライドアニメーションを開始
            setTimeout(() => {
                applySlideAnimations();
                
                // アニメーション完了後にロジックを更新
                setTimeout(() => {
                    rotateBoardLogic();
                    renderBoard(); // 変形をリセットし、新しい配列状態で再描画
                    
                    if (checkWin(currentPlayer)) {
                        statusEl.textContent = `🎉 Player ${currentPlayer} の勝利！`;
                        statusEl.style.color = currentPlayer === 'O' ? 'var(--player-o)' : 'var(--player-x)';
                        gameOver = true;
                    } else if (checkDraw()) {
                        statusEl.textContent = "引き分けです！";
                        gameOver = true;
                    } else {
                        currentPlayer = currentPlayer === 'O' ? 'X' : 'O';
                        updateStatus();
                    }
                    isAnimating = false;
                }, 500); // アニメーション時間(0.5秒)に合わせる
            }, 300);
        }

        function applySlideAnimations() {
            const cells = boardEl.children;
            for (let i = 0; i < cells.length; i++) {
                const r = parseInt(cells[i].dataset.row);
                const c = parseInt(cells[i].dataset.col);
                const offsets = getMoveOffsets(r, c);
                
                // X方向、Y方向へのピクセル移動量を計算
                const moveX = offsets.dx * MOVE_UNIT;
                const moveY = offsets.dy * MOVE_UNIT;
                
                cells[i].classList.add('animating');
                cells[i].style.transition = 'transform 0.5s ease-in-out';
                cells[i].style.transform = `translate(${moveX}px, ${moveY}px)`;
                
                // Z-indexを調整して、角の移動がなるべく綺麗に見えるようにする
                cells[i].style.zIndex = 10;
            }
        }

        // 行(r)・列(c)に応じて、X軸とY軸にどれくらい移動するか（dx, dy）を返す
        function getMoveOffsets(r, c) {
            // 内側2x2 (時計回りに1マス移動)
            if (r === 1 && c === 1) return { dx: 1, dy: 0 };  // 右へ
            if (r === 1 && c === 2) return { dx: 0, dy: 1 };  // 下へ
            if (r === 2 && c === 2) return { dx: -1, dy: 0 }; // 左へ
            if (r === 2 && c === 1) return { dx: 0, dy: -1 }; // 上へ
            
            // 外側リング (反時計回りに1マス移動)
            if (r === 0 && c > 0) return { dx: -1, dy: 0 }; // 上端（左端以外）は左へ
            if (c === 0 && r < 3) return { dx: 0, dy: 1 };  // 左端（下端以外）は下へ
            if (r === 3 && c < 3) return { dx: 1, dy: 0 };  // 下端（右端以外）は右へ
            if (c === 3 && r > 0) return { dx: 0, dy: -1 }; // 右端（上端以外）は上へ
            
            return { dx: 0, dy: 0 };
        }

        function rotateBoardLogic() {
            let newBoard = Array(4).fill(null).map(() => Array(4).fill(''));
            
            // 内側4マス（時計回り）
            newBoard[1][2] = board[1][1];
            newBoard[2][2] = board[1][2];
            newBoard[2][1] = board[2][2];
            newBoard[1][1] = board[2][1];

            // 外側12マス（反時計回り）
            newBoard[1][0] = board[0][0];
            newBoard[2][0] = board[1][0];
            newBoard[3][0] = board[2][0];
            newBoard[3][1] = board[3][0];
            newBoard[3][2] = board[3][1];
            newBoard[3][3] = board[3][2];
            newBoard[2][3] = board[3][3];
            newBoard[1][3] = board[2][3];
            newBoard[0][3] = board[1][3];
            newBoard[0][2] = board[0][3];
            newBoard[0][1] = board[0][2];
            newBoard[0][0] = board[0][1];

            board = newBoard;
        }

        function checkWin(player) {
            for (let i = 0; i < 4; i++) {
                if (board[i][0] === player && board[i][1] === player && board[i][2] === player && board[i][3] === player) return true;
                if (board[0][i] === player && board[1][i] === player && board[2][i] === player && board[3][i] === player) return true;
            }
            if (board[0][0] === player && board[1][1] === player && board[2][2] === player && board[3][3] === player) return true;
            if (board[0][3] === player && board[1][2] === player && board[2][1] === player && board[3][0] === player) return true;
            return false;
        }

        function checkDraw() {
            return board.every(row => row.every(cell => cell !== ''));
        }

        function updateStatus() {
            statusEl.textContent = `Player ${currentPlayer} のばんです`;
            statusEl.style.color = '#1a202c';
        }

        initGame();
    </script>
</body>
</html>
