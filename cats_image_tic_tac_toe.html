<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ぐるぐる ねこならべ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap');

        :root {
            --bg-color: #FFF9C4;
            --board-bg: #FFAB91;
            --cell-outer: #C8E6C9;
            --cell-inner: #FFF59D;
            --text-color: #5D4037;
            --cell-size: 70px;
            --gap-size: 10px;
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic Pro', sans-serif;
            background: radial-gradient(circle at center, #FFFFFF 0%, var(--bg-color) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.2rem;
            color: #E64A179;
            text-shadow: 2px 2px 0px #FFCCBC;
        }
        h1 { color: #E64A17; }

        #status {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: white;
            padding: 8px 24px;
            border-radius: 24px;
            box-shadow: 0 4px 0 #FFCCBC;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #status img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .board-container {
            background-color: var(--board-bg);
            padding: 12px;
            border-radius: 24px;
            box-shadow: 0 8px 0 #D84315, 0 15px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(4, var(--cell-size));
            grid-template-rows: repeat(4, var(--cell-size));
            gap: var(--gap-size);
            position: relative;
        }

        .cell {
            border-radius: 16px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1);
            position: relative;
            cursor: pointer;
            z-index: 1; 
        }

        .cell[data-inner="true"] {
            background-color: var(--cell-inner);
            border: 3px dashed #FBC02D;
            box-sizing: border-box;
        }
        
        .cell[data-inner="false"] {
            background-color: var(--cell-outer);
            border: 3px solid #A5D6A7;
            box-sizing: border-box;
        }
        
        .pieces-layer {
            position: absolute;
            top: 12px;
            left: 12px;
            pointer-events: none;
        }

        /* コマ（猫画像）のスタイル */
        .piece {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            /* 512x512の画像を70pxの枠に収める */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: top 0.5s ease-in-out, left 0.5s ease-in-out;
        }
        
        .piece img {
            width: 85%; /* 枠より少し小さくして余白を作る（マス間の重なり対策） */
            height: 85%;
            object-fit: contain;
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.25)); /* 画像に軽い影をつけて浮き上がらせる */
        }

        .piece.pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .win-jump {
            animation: jump 0.5s ease infinite alternate !important;
        }
        @keyframes jump {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .reset-btn {
            margin-top: 2rem;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 6px 0 #388E3C;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .reset-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #388E3C;
        }
        
        .description {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #795548;
            text-align: center;
            max-width: 320px;
            line-height: 1.6;
            background: rgba(255,255,255,0.6);
            padding: 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <h1>🐱 ぐるぐる ねこならべ 🐾</h1>
    <div id="status"></div>

    <div class="board-container">
        <div class="board-grid" id="boardGrid"></div>
        <div class="pieces-layer" id="piecesLayer"></div>
    </div>

    <button class="reset-btn" onclick="initGame()">もういっかい！</button>

    <div class="description">
        あそびかた<br>
        ねこをおくと、みんなでおさんぽするよ！<br>
        おなじ ねこが ４つ ならんだら かち！
    </div>

    <script>
        // 画像ファイルのパスを設定（同フォルダに配置する想定）
        const PLAYER_1 = 'white_cat.png';
        const PLAYER_2 = 'tiger_cat.png';
        const PLAYER_1_NAME = 'しろねこ';
        const PLAYER_2_NAME = 'とらねこ';
        
        const CELL_UNIT = 80;

        let board = [];
        let currentPlayer = PLAYER_1;
        let gameOver = false;
        let isAnimating = false;
        let pieceElements = {};

        const gridEl = document.getElementById('boardGrid');
        const layerEl = document.getElementById('piecesLayer');
        const statusEl = document.getElementById('status');

        function initGame() {
            board = Array(4).fill(null).map(() => Array(4).fill(''));
            currentPlayer = PLAYER_1;
            gameOver = false;
            isAnimating = false;
            pieceElements = {};
            
            updateStatus();
            renderGrid();
            layerEl.innerHTML = '';
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.inner = ((r === 1 || r === 2) && (c === 1 || c === 2)) ? "true" : "false";
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    gridEl.appendChild(cell);
                }
            }
        }
        
        function getPixelPos(r, c) {
            return { top: r * CELL_UNIT, left: c * CELL_UNIT };
        }

        function handleCellClick(r, c) {
            if (gameOver || isAnimating || board[r][c] !== '') return;

            board[r][c] = currentPlayer;
            
            // 猫画像用のimg要素を作成
            const piece = document.createElement('div');
            piece.className = 'piece pop';
            
            const img = document.createElement('img');
            img.src = currentPlayer; // 画像ファイルパスを設定
            img.alt = currentPlayer === PLAYER_1 ? PLAYER_1_NAME : PLAYER_2_NAME;
            piece.appendChild(img);
            
            const pos = getPixelPos(r, c);
            piece.style.top = `${pos.top}px`;
            piece.style.left = `${pos.left}px`;
            layerEl.appendChild(piece);
            
            pieceElements[`${r}-${c}`] = piece;
            isAnimating = true;

            setTimeout(() => {
                animateCatsToNewPositions();
                
                setTimeout(() => {
                    finalizeTurn();
                }, 500); 
            }, 400); 
        }

        function animateCatsToNewPositions() {
            const newPieceElements = {};
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const key = `${r}-${c}`;
                    if (pieceElements[key]) {
                        const el = pieceElements[key];
                        el.classList.remove('pop');
                        
                        const offsets = getMoveOffsets(r, c);
                        const newR = r + offsets.dy;
                        const newC = c + offsets.dx;
                        const pos = getPixelPos(newR, newC);
                        
                        el.style.top = `${pos.top}px`;
                        el.style.left = `${pos.left}px`;
                        
                        newPieceElements[`${newR}-${newC}`] = el;
                    }
                }
            }
            pieceElements = newPieceElements;
        }

        function finalizeTurn() {
            rotateBoardLogic();
            
            if (checkWin(currentPlayer)) {
                const name = currentPlayer === PLAYER_1 ? PLAYER_1_NAME : PLAYER_2_NAME;
                statusEl.innerHTML = `🎉 ${name} の かち！ 🎉`;
                statusEl.style.color = '#D84315';
                highlightWinningCats(currentPlayer);
                gameOver = true;
            } else if (checkDraw()) {
                statusEl.innerHTML = "ひきわけ！";
                gameOver = true;
            } else {
                currentPlayer = currentPlayer === PLAYER_1 ? PLAYER_2 : PLAYER_1;
                updateStatus();
            }
            isAnimating = false;
        }

        function getMoveOffsets(r, c) {
            if (r === 1 && c === 1) return { dx: 1, dy: 0 };
            if (r === 1 && c === 2) return { dx: 0, dy: 1 };
            if (r === 2 && c === 2) return { dx: -1, dy: 0 };
            if (r === 2 && c === 1) return { dx: 0, dy: -1 };
            
            if (r === 0 && c > 0) return { dx: -1, dy: 0 };
            if (c === 0 && r < 3) return { dx: 0, dy: 1 };
            if (r === 3 && c < 3) return { dx: 1, dy: 0 };
            if (c === 3 && r > 0) return { dx: 0, dy: -1 };
            
            return { dx: 0, dy: 0 };
        }

        function rotateBoardLogic() {
            let newBoard = Array(4).fill(null).map(() => Array(4).fill(''));
            
            newBoard[1][2] = board[1][1];
            newBoard[2][2] = board[1][2];
            newBoard[2][1] = board[2][2];
            newBoard[1][1] = board[2][1];

            newBoard[1][0] = board[0][0];
            newBoard[2][0] = board[1][0];
            newBoard[3][0] = board[2][0];
            newBoard[3][1] = board[3][0];
            newBoard[3][2] = board[3][1];
            newBoard[3][3] = board[3][2];
            newBoard[2][3] = board[3][3];
            newBoard[1][3] = board[2][3];
            newBoard[0][3] = board[1][3];
            newBoard[0][2] = board[0][3];
            newBoard[0][1] = board[0][2];
            newBoard[0][0] = board[0][1];

            board = newBoard;
        }

        function checkWin(player) {
            for (let i = 0; i < 4; i++) {
                if (board[i][0] === player && board[i][1] === player && board[i][2] === player && board[i][3] === player) return true;
                if (board[0][i] === player && board[1][i] === player && board[2][i] === player && board[3][i] === player) return true;
            }
            if (board[0][0] === player && board[1][1] === player && board[2][2] === player && board[3][3] === player) return true;
            if (board[0][3] === player && board[1][2] === player && board[2][1] === player && board[3][0] === player) return true;
            return false;
        }
        
        function highlightWinningCats(player) {
            Object.values(pieceElements).forEach(piece => {
                const img = piece.querySelector('img');
                if (img && img.src.includes(player)) {
                    piece.classList.add('win-jump');
                }
            });
        }

        function checkDraw() {
            return board.every(row => row.every(cell => cell !== ''));
        }

        function updateStatus() {
            const src = currentPlayer;
            const name = currentPlayer === PLAYER_1 ? PLAYER_1_NAME : PLAYER_2_NAME;
            statusEl.innerHTML = `<img src="${src}" alt="${name}"> ${name} のばん！`;
            statusEl.style.color = 'var(--text-color)';
        }

        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
