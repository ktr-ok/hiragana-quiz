<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f5ed" />
  <title>かたちを はめよう！ Ver.2</title>
  <style>
    :root {
      --ink: #26354a;
      --paper: #f8f5ed;
      --grid: #dbe4ee;
      --cell: clamp(54px, 10.2vw, 102px);
      --board: calc(var(--cell) * 4);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-width: 320px; overflow: hidden; color: var(--ink);
      background: radial-gradient(circle at 14% 15%, #fff 0 6%, transparent 6.5%), radial-gradient(circle at 89% 80%, #fff2c2 0 8%, transparent 8.5%), var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    button { font: inherit; }
    .app { min-height: 100%; padding: clamp(14px, 2.4vw, 30px); display: grid; grid-template-rows: auto 1fr auto; gap: clamp(10px, 1.8vw, 20px); }
    header { min-height: 54px; display: flex; align-items: center; justify-content: center; position: relative; }
    h1 { margin: 0; color: #344865; font-size: clamp(27px, 4vw, 48px); letter-spacing: .04em; }
    .progress { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; gap: 7px; }
    .star { width: clamp(25px, 3vw, 37px); aspect-ratio: 1; color: #d4dce7; transition: color .25s ease, transform .25s ease; }
    .star.on { color: #ffbd2e; transform: scale(1.12) rotate(8deg); }
    .game { min-height: 0; display: grid; grid-template-columns: minmax(250px, 1fr) auto; align-items: center; justify-content: center; gap: clamp(22px, 7vw, 94px); }
    .tray { width: min(39vw, 390px); min-width: 250px; min-height: min(62vh, 510px); padding: clamp(12px, 2vw, 24px); display: flex; flex-direction: column; justify-content: center; gap: clamp(14px, 2.2vh, 28px); border: 4px dashed #cbd8e5; border-radius: 30px; background: rgba(255,255,255,.5); }
    .piece-slot { min-height: calc(var(--cell) * 1.15); display: flex; align-items: center; justify-content: center; }
    .piece { position: relative; display: grid; grid-template-columns: repeat(var(--w), var(--cell)); grid-template-rows: repeat(var(--h), var(--cell)); cursor: grab; touch-action: none; transform-origin: center; filter: drop-shadow(0 7px 0 rgba(38,53,74,.12)) drop-shadow(0 12px 12px rgba(38,53,74,.14)); transition: filter .16s ease, transform .16s ease; }
    .piece:hover { transform: scale(1.025); }
    .piece:active { cursor: grabbing; }
    .piece.dragging { position: fixed; z-index: 20; margin: 0; pointer-events: none; cursor: grabbing; transform: scale(1.07); filter: drop-shadow(0 12px 0 rgba(38,53,74,.13)) drop-shadow(0 20px 20px rgba(38,53,74,.2)); transition: none; }
    .piece.placed { position: absolute; cursor: grab; pointer-events: auto; filter: none; }
    .piece-cell { grid-column: calc(var(--x) + 1); grid-row: calc(var(--y) + 1); background: var(--color); border: 4px solid rgba(38,53,74,.62); border-radius: 13px; box-shadow: inset 0 5px 0 rgba(255,255,255,.27), inset 0 -4px 0 rgba(0,0,0,.09); }
    .board-wrap { position: relative; }
    .board { position: relative; width: var(--board); height: var(--board); overflow: hidden; border: 7px solid #344865; border-radius: 24px; background-color: #fff; background-image: linear-gradient(to right, var(--grid) 2px, transparent 2px), linear-gradient(to bottom, var(--grid) 2px, transparent 2px); background-size: var(--cell) var(--cell); box-shadow: 0 10px 0 #c9d3df, 0 16px 22px rgba(38,53,74,.16); }
    .placed-layer { position: absolute; inset: 0; pointer-events: none; }
    .placed-layer .piece { pointer-events: auto; left: calc(var(--board-x) * var(--cell)); top: calc(var(--board-y) * var(--cell)); }
    footer { display: flex; justify-content: center; }
    .reset, .again { min-height: 60px; padding: 10px 28px; border: 0; border-radius: 999px; font-weight: 800; cursor: pointer; }
    .reset { min-width: 180px; background: #fff; color: #344865; font-size: clamp(19px, 2.4vw, 28px); letter-spacing: .06em; box-shadow: 0 5px 0 #c9d3df, 0 9px 15px rgba(38,53,74,.13); }
    .message { position: fixed; z-index: 40; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(248,245,237,.78); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
    .message.show { opacity: 1; visibility: visible; }
    .card { width: min(560px, 90vw); padding: 40px 28px 30px; border-radius: 34px; text-align: center; background: #fff; box-shadow: 0 16px 38px rgba(38,53,74,.24); transform: scale(.88); transition: transform .28s cubic-bezier(.2,.9,.3,1.3); }
    .message.show .card { transform: scale(1); }
    .yay { margin: 0; font-size: clamp(44px, 8vw, 76px); }
    .stars-big { margin: 10px 0 22px; color: #ffbd2e; font-size: clamp(40px, 7vw, 70px); letter-spacing: .12em; }
    .again { min-height: 66px; background: #4d96ff; color: #fff; font-size: 25px; box-shadow: 0 5px 0 #2f70c7; }
    .confetti { position: fixed; z-index: 35; top: -30px; left: 0; width: 13px; height: 19px; border-radius: 4px; pointer-events: none; animation: fall 1.7s ease-in forwards; }
    @keyframes fall { from { transform: translateX(var(--x)) translateY(0) rotate(0deg); opacity: 1; } to { transform: translateX(calc(var(--x) + var(--drift))) translateY(110vh) rotate(680deg); opacity: 0; } }
    @media (max-width: 700px) and (orientation: portrait) { body { overflow: auto; } .app { min-height: 100vh; } .game { grid-template-columns: 1fr; gap: 18px; } .tray { width: min(92vw, 500px); min-height: unset; flex-direction: row; margin: auto; } .piece-slot { min-width: 0; transform: scale(.62); margin: calc(var(--cell) * -.2); } .board-wrap { margin: auto; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>かたちを はめよう！</h1>
      <div class="progress" aria-label="進みぐあい"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
    </header>
    <section class="game" aria-label="パズル">
      <div class="tray" id="tray" aria-label="ピース置き場"></div>
      <div class="board-wrap"><div class="board" id="board" aria-label="パズル盤面"><div class="placed-layer" id="placedLayer"></div></div></div>
    </section>
    <footer><button class="reset" id="resetButton" type="button">↻ もういちど</button></footer>
  </main>
  <div class="message" id="message" role="dialog" aria-modal="true" aria-label="クリア"><div class="card"><p class="yay">できた！</p><div class="stars-big">★★★</div><button class="again" id="againButton" type="button">もういちど</button></div></div>

  <script>
    /* Ver.2: 色ヒントなし。空いているマスなら任意の位置に仮置きできる。 */
    const BOARD_SIZE = 4;
    const PIECE_SIZES = [4, 5, 7];
    const COLORS = ['#ff6b6b', '#4d96ff', '#ffd93d'];
    const NAMES = ['あか', 'あお', 'きいろ'];
    const IDS = ['red', 'blue', 'yellow'];

    const tray = document.getElementById('tray');
    const board = document.getElementById('board');
    const placedLayer = document.getElementById('placedLayer');
    const stars = [...document.querySelectorAll('.star')];
    const message = document.getElementById('message');

    let pieces = [];
    let active = null;

    const key = (x, y) => `${x},${y}`;
    const fromKey = value => value.split(',').map(Number);
    const cellKey = ([x, y]) => key(x, y);
    const compareCells = (a, b) => a[1] - b[1] || a[0] - b[0];

    function neighbors([x, y]) {
      return [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]
        .filter(([nx, ny]) => nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE);
    }

    function isConnected(cells) {
      if (!cells.length) return false;
      const all = new Set(cells.map(cellKey));
      const seen = new Set([cellKey(cells[0])]);
      const queue = [cells[0]];
      while (queue.length) {
        const cell = queue.shift();
        for (const next of neighbors(cell)) {
          const nextKey = cellKey(next);
          if (all.has(nextKey) && !seen.has(nextKey)) {
            seen.add(nextKey);
            queue.push(next);
          }
        }
      }
      return seen.size === cells.length;
    }

    function normalize(cells) {
      const minX = Math.min(...cells.map(([x]) => x));
      const minY = Math.min(...cells.map(([, y]) => y));
      return cells.map(([x, y]) => [x - minX, y - minY]).sort(compareCells);
    }

    function width(cells) { return Math.max(...cells.map(([x]) => x)) + 1; }
    function height(cells) { return Math.max(...cells.map(([, y]) => y)) + 1; }
    function randomItem(items) { return items[Math.floor(Math.random() * items.length)]; }
    function shapeSignature(cells) { return normalize(cells).map(([x, y]) => `${x}:${y}`).join('|'); }

    function candidateCells(remaining, wantedSize, maxAttempts = 300) {
      const available = [...remaining].map(fromKey);
      for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
        const start = randomItem(available);
        const selected = new Map([[cellKey(start), start]]);
        while (selected.size < wantedSize) {
          const frontier = [];
          selected.forEach(cell => {
            neighbors(cell).forEach(next => {
              const nextKey = cellKey(next);
              if (remaining.has(nextKey) && !selected.has(nextKey)) frontier.push(next);
            });
          });
          if (!frontier.length) break;
          const next = randomItem(frontier);
          selected.set(cellKey(next), next);
        }
        const cells = [...selected.values()];
        if (cells.length === wantedSize && isConnected(cells)) return cells;
      }
      return null;
    }

    function generatePuzzle() {
      const fullBoard = new Set();
      for (let y = 0; y < BOARD_SIZE; y += 1) {
        for (let x = 0; x < BOARD_SIZE; x += 1) fullBoard.add(key(x, y));
      }

      for (let restart = 0; restart < 3000; restart += 1) {
        let remaining = new Set(fullBoard);
        const groups = [];
        let failed = false;

        for (let i = 0; i < PIECE_SIZES.length - 1; i += 1) {
          const cells = candidateCells(remaining, PIECE_SIZES[i]);
          if (!cells) { failed = true; break; }
          cells.forEach(cell => remaining.delete(cellKey(cell)));
          if (!isConnected([...remaining].map(fromKey))) { failed = true; break; }
          groups.push(cells);
        }

        const last = [...remaining].map(fromKey);
        if (failed || last.length !== PIECE_SIZES[2] || !isConnected(last)) continue;
        groups.push(last);

        const signatures = new Set(groups.map(shapeSignature));
        if (signatures.size !== 3) continue;
        if (groups.some(cells => width(normalize(cells)) === 1 || height(normalize(cells)) === 1)) continue;

        return groups.map((cells, index) => {
          const normalized = normalize(cells);
          return {
            id: IDS[index],
            color: COLORS[index],
            name: NAMES[index],
            cells: normalized,
            target: {
              x: Math.min(...cells.map(([x]) => x)),
              y: Math.min(...cells.map(([, y]) => y))
            },
            w: width(normalized),
            h: height(normalized),
            placed: null
          };
        });
      }
      throw new Error('問題を生成できませんでした。もう一度押してください。');
    }

    function buildCells(element, piece) {
      piece.cells.forEach(([x, y]) => {
        const cell = document.createElement('span');
        cell.className = 'piece-cell';
        cell.style.setProperty('--x', x);
        cell.style.setProperty('--y', y);
        element.appendChild(cell);
      });
    }

    function makePiece(piece) {
      const element = document.createElement('div');
      element.className = 'piece';
      element.dataset.id = piece.id;
      element.setAttribute('role', 'img');
      element.setAttribute('aria-label', `${piece.name}のピース`);
      element.style.setProperty('--w', piece.w);
      element.style.setProperty('--h', piece.h);
      element.style.setProperty('--color', piece.color);
      buildCells(element, piece);
      element.addEventListener('pointerdown', startDrag);
      return element;
    }

    function render() {
      tray.innerHTML = '';
      placedLayer.innerHTML = '';
      pieces.forEach(piece => {
        const element = makePiece(piece);
        if (piece.placed) {
          element.classList.add('placed');
          element.style.setProperty('--board-x', piece.placed.x);
          element.style.setProperty('--board-y', piece.placed.y);
          placedLayer.appendChild(element);
        } else {
          const slot = document.createElement('div');
          slot.className = 'piece-slot';
          slot.appendChild(element);
          tray.appendChild(slot);
        }
      });
    }

    function getPiece(id) { return pieces.find(piece => piece.id === id); }

    function boardPositionFromElement(element) {
      const boardRect = board.getBoundingClientRect();
      const elementRect = element.getBoundingClientRect();
      const border = 7;
      const innerLeft = boardRect.left + border;
      const innerTop = boardRect.top + border;
      const cellSize = (boardRect.width - border * 2) / BOARD_SIZE;
      return {
        x: Math.round((elementRect.left - innerLeft) / cellSize),
        y: Math.round((elementRect.top - innerTop) / cellSize)
      };
    }

    function cellsAt(piece, position) {
      return piece.cells.map(([x, y]) => [position.x + x, position.y + y]);
    }

    function canPlace(piece, position) {
      const proposedCells = cellsAt(piece, position);
      if (proposedCells.some(([x, y]) => x < 0 || y < 0 || x >= BOARD_SIZE || y >= BOARD_SIZE)) return false;

      const occupied = new Set();
      pieces.forEach(other => {
        if (other.id === piece.id || !other.placed) return;
        cellsAt(other, other.placed).forEach(([x, y]) => occupied.add(key(x, y)));
      });
      return !proposedCells.some(([x, y]) => occupied.has(key(x, y)));
    }

    function isCorrect(piece) {
      return piece.placed && piece.placed.x === piece.target.x && piece.placed.y === piece.target.y;
    }

    function updateProgressAndCompletion() {
      const correctCount = pieces.filter(isCorrect).length;
      stars.forEach((star, index) => star.classList.toggle('on', index < correctCount));
      if (correctCount === pieces.length) window.setTimeout(complete, 250);
    }

    function startDrag(event) {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      const element = event.currentTarget;
      const piece = getPiece(element.dataset.id);
      event.preventDefault();

      const rect = element.getBoundingClientRect();
      const wasPlaced = Boolean(piece.placed);
      const previousPosition = piece.placed ? { ...piece.placed } : null;
      active = {
        element,
        piece,
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top,
        pointerId: event.pointerId,
        wasPlaced,
        previousPosition
      };

      piece.placed = null;
      try { element.setPointerCapture(event.pointerId); } catch (_) {}
      element.classList.remove('placed');
      element.classList.add('dragging');
      document.body.appendChild(element);
      movePiece(event);
      window.addEventListener('pointermove', movePiece);
      window.addEventListener('pointerup', endDrag, { once: true });
      window.addEventListener('pointercancel', cancelDrag, { once: true });
    }

    function movePiece(event) {
      if (!active || event.pointerId !== active.pointerId) return;
      const { element, offsetX, offsetY } = active;
      element.style.left = `${event.clientX - offsetX}px`;
      element.style.top = `${event.clientY - offsetY - 18}px`;
    }

    function cleanDragListeners() {
      window.removeEventListener('pointermove', movePiece);
    }

    function endDrag(event) {
      if (!active || event.pointerId !== active.pointerId) return;
      const { element, piece, wasPlaced, previousPosition } = active;

      // left/top を消す前、すなわち実際に離した位置のままで盤面座標を計算する。
      const position = boardPositionFromElement(element);
      const boardRect = board.getBoundingClientRect();
      const pieceRect = element.getBoundingClientRect();
      const centerX = pieceRect.left + pieceRect.width / 2;
      const centerY = pieceRect.top + pieceRect.height / 2;
      const isOverBoard = centerX >= boardRect.left && centerX <= boardRect.right && centerY >= boardRect.top && centerY <= boardRect.bottom;

      cleanDragListeners();

      if (isOverBoard && canPlace(piece, position)) {
        piece.placed = position;
      } else if (wasPlaced) {
        piece.placed = previousPosition;
      } else {
        piece.placed = null;
      }

      active = null;
      render();
      updateProgressAndCompletion();
    }

    function cancelDrag(event) {
      if (!active || (event && event.pointerId !== active.pointerId)) return;
      const { piece, wasPlaced, previousPosition } = active;
      cleanDragListeners();
      piece.placed = wasPlaced ? previousPosition : null;
      active = null;
      render();
    }

    function makeConfetti() {
      const colors = ['#ff6b6b', '#4d96ff', '#ffd93d', '#66d19e', '#b487ff'];
      for (let i = 0; i < 60; i += 1) {
        const item = document.createElement('div');
        item.className = 'confetti';
        item.style.left = `${3 + Math.random() * 94}vw`;
        item.style.background = colors[i % colors.length];
        item.style.setProperty('--x', `${Math.random() * 20 - 10}px`);
        item.style.setProperty('--drift', `${Math.random() * 160 - 80}px`);
        item.style.animationDelay = `${Math.random() * .35}s`;
        document.body.appendChild(item);
        window.setTimeout(() => item.remove(), 2300);
      }
    }

    function complete() {
      if (message.classList.contains('show')) return;
      makeConfetti();
      message.classList.add('show');
    }

    function reset() {
      if (active) cancelDrag();
      message.classList.remove('show');
      stars.forEach(star => star.classList.remove('on'));
      pieces = generatePuzzle();
      console.log('新しい問題:', pieces);
      render();
    }

    document.getElementById('resetButton').addEventListener('click', reset);
    document.getElementById('againButton').addEventListener('click', reset);
    reset();
  </script>
</body>
</html>
