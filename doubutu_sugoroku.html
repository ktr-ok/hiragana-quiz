<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>わくわく どうぶつすごろく</title>
  <style>
    :root{--ink:#42362b;--cream:#fff8df;--coral:#f46f61;--blue:#4f9ee9;--green:#6fc68b;--yellow:#f7c84d;--purple:#a980db}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#a8e3fa 0 28%,#f8dea2 28%);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:700;min-height:100vh;user-select:none}button{font:inherit;font-weight:800;color:var(--ink);border:0;cursor:pointer;touch-action:manipulation}.app{max-width:1180px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(22px,4vw,34px);margin:0}.turn{background:#fff;padding:10px 16px;border-radius:999px;box-shadow:0 4px 0 #b8d8df;white-space:nowrap}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.player{min-height:61px;border-radius:16px;padding:8px;background:#fff8e8;opacity:.55;display:flex;align-items:center;gap:6px;justify-content:center;box-shadow:0 3px 0 rgba(97,72,37,.16)}.player.active{opacity:1;outline:4px solid var(--yellow);transform:translateY(-2px)}.face{font-size:25px}.name{font-size:14px}.place{font-size:12px;color:#806b55}.map-wrap{overflow-x:auto;overscroll-behavior-x:contain;border-radius:26px;background:#9adcf4;box-shadow:inset 0 0 0 7px rgba(255,255,255,.55);scroll-behavior:smooth;-webkit-overflow-scrolling:touch}.map{width:2160px;height:590px;position:relative;background:linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px) 0 0/90px 90px,linear-gradient(#9adcf4 0 53%,#a5d97d 53%)}.cloud{position:absolute;color:#fff;opacity:.85;font-size:54px}.c1{left:210px;top:35px}.c2{left:1270px;top:70px}.c3{left:1820px;top:20px}.road{position:absolute;inset:0;width:2160px;height:590px;pointer-events:none}.road polyline{fill:none;stroke:#f7e8c3;stroke-width:58;stroke-linecap:round;stroke-linejoin:round}.road polyline+polyline{stroke:#d8be86;stroke-width:5;stroke-dasharray:3 22}.space{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;display:grid;place-items:center;background:#fff9e9;border:5px solid #fff;box-shadow:0 4px 0 rgba(92,76,51,.24);font-size:27px;cursor:pointer}.space small{position:absolute;bottom:-19px;font-size:12px;white-space:nowrap;color:#5d5044}.space.start,.space.goal{width:94px;height:94px;margin:-47px 0 0 -47px;font-size:33px}.space.start{background:var(--green)}.space.goal{background:var(--coral)}.space.event{background:#fff0aa}.space.back{background:#d8c0f5}.token{position:absolute;width:40px;height:40px;z-index:5;font-size:36px;line-height:40px;text-align:center;pointer-events:none;filter:drop-shadow(0 3px 1px rgba(48,39,31,.25));transition:left .48s ease,top .48s ease}.controls{display:grid;grid-template-columns:100px 210px;grid-template-areas:"message message" "dice advance";justify-content:center;align-items:center;gap:12px;padding:15px 0 3px}.dice,.advance{height:78px;border-radius:21px;box-shadow:0 6px 0 #d5c8af}.dice{grid-area:dice;width:100px;background:#fff;color:#ee6254;font-size:42px}.advance{grid-area:advance;width:210px;background:var(--yellow);font-size:17px}.dice:disabled,.advance:disabled{opacity:.5}.message{grid-area:message;font-size:clamp(16px,2.6vw,21px);text-align:center;min-height:30px;max-width:600px}.tip{text-align:center;font-size:13px;color:#705f4f;margin:8px}.modal{position:fixed;inset:0;z-index:20;background:rgba(45,57,71,.44);display:grid;place-items:center;padding:20px}.modal.hidden{display:none}.panel{background:var(--cream);width:min(510px,100%);padding:27px;border-radius:30px;text-align:center;box-shadow:0 12px 0 rgba(58,45,32,.25)}.panel h2{margin:0 0 8px;font-size:29px}.panel p{margin:0 0 17px}.choices{display:flex;gap:10px;justify-content:center}.choices button{width:94px;height:75px;border-radius:18px;background:#fff;box-shadow:0 4px 0 #d7c49d;font-size:17px}.choices button.selected{background:var(--yellow);outline:3px solid #e99f32}.begin,.again{margin-top:18px;background:var(--coral);color:#fff;border-radius:18px;min-height:58px;padding:0 34px;font-size:19px;box-shadow:0 5px 0 #c55349}.winner{font-size:68px;margin:0}@media(max-width:600px){.app{padding-left:12px;padding-right:12px}.players{gap:5px}.player{padding:5px;min-height:52px}.face{font-size:20px}.name,.place{font-size:11px}.controls{grid-template-columns:72px minmax(176px,210px);gap:8px}.dice,.advance{height:67px}.dice{width:72px;font-size:34px}.advance{width:100%;font-size:15px}.map-wrap{border-radius:19px}}
  </style>
</head>
<body><main class="app"><header><h1>わくわく どうぶつすごろく</h1><div class="turn" id="turn">じゅんびちゅう</div></header><section class="players" id="players" aria-label="プレイヤー"></section><section class="map-wrap" id="mapWrap" aria-label="すごろく盤面。横にスクロールできます"><div class="map" id="map"><span class="cloud c1">☁</span><span class="cloud c2">☁</span><span class="cloud c3">☁</span><svg class="road" viewBox="0 0 2160 590" aria-hidden="true"><polyline id="path"></polyline><polyline id="pathDots"></polyline></svg></div></section><section class="controls"><button class="dice" id="dice" type="button" aria-label="サイコロをふる">🎲</button><button class="advance" id="advance" type="button" disabled>1マス すすむ</button><div class="message" id="message" aria-live="polite">人数をえらんで、スタート！</div></section><p class="tip">盤面は指で横にスクロールできます</p></main><div class="modal" id="setup"><div class="panel"><h2>なんにんで あそぶ？</h2><p>2人から4人で遊べるよ</p><div class="choices" id="choices"><button data-count="2" class="selected" type="button">2人<br>🐰 🐻</button><button data-count="3" type="button">3人<br>🐰 🐻 🐱</button><button data-count="4" type="button">4人<br>🐰 🐻 🐱 🐸</button></div><button class="begin" id="begin" type="button">スタート！</button></div></div><div class="modal hidden" id="finish"><div class="panel"><p class="winner" id="winnerFace">🐰</p><h2 id="winnerTitle">いちばんのり！</h2><p id="winnerText"></p><button class="again" id="again" type="button">もう いちど</button></div></div>
<script>
const faces=['🐰','🐻','🐱','🐸'],colors=['#f46f61','#4f9ee9','#f2b93b','#9b78d3'],names=['うさぎ','くま','ねこ','かえる'];const y=[395,320,230,165,215,300,390,435,365,275,190,155,220,320,410,445,385,295,205,160,220,310,400,435,365],x=y.map((_,i)=>70+i*83),event={3:['🌈','にじの ちかみち！','forward',2],6:['🍎','りんごで げんき！','forward',1],9:['🌧️','あめで すべった！','back',2],13:['🎈','ふうせんで とんだ！','forward',2],17:['🐌','かたつむりと おさんぽ','back',1],21:['⭐','おほしさま パワー！','forward',2]};const map=document.getElementById('map'),wrap=document.getElementById('mapWrap'),dice=document.getElementById('dice'),advance=document.getElementById('advance'),message=document.getElementById('message');let count=2,players=[],current=0,rolling=false,steps=0,direction=1,pending=null,finishOrder=[];
function spaceInfo(i){if(i===0)return'🚩 スタート！ ゴールまで 24マス';if(i===24)return'🏆 ゴール！ ここに ついたら いちばんのり';if(event[i]){let [icon,text,type,amount]=event[i];return `${icon} ${text} とまると ${amount}マス ${type==='forward'?'すすむ':'もどる'}`};return `🌼 ふつうのマス。ゴールまで あと ${24-i}マス`}
function buildBoard(){document.getElementById('path').setAttribute('points',x.map((v,i)=>v+','+y[i]).join(' '));document.getElementById('pathDots').setAttribute('points',x.map((v,i)=>v+','+y[i]).join(' '));for(let i=0;i<x.length;i++){let s=document.createElement('div');s.className='space'+(i===0?' start':i===x.length-1?' goal':event[i]?' event':'');if(event[i]?.[2]==='back')s.classList.add('back');s.style.left=x[i]+'px';s.style.top=y[i]+'px';s.textContent=i===0?'🚩':i===x.length-1?'🏆':event[i]?event[i][0]:'🌼';s.setAttribute('role','button');s.setAttribute('aria-label',spaceInfo(i));s.addEventListener('click',()=>{if(!rolling)message.textContent=spaceInfo(i)});let n=document.createElement('small');n.textContent=i===0?'スタート':i===x.length-1?'ゴール':'';s.append(n);map.append(s)}}
function draw(){let holder=document.getElementById('players');holder.innerHTML='';players.forEach((p,i)=>{let rank=finishOrder.indexOf(i)+1;let d=document.createElement('div');d.className='player'+(i===current&&!p.finished?' active':'');d.innerHTML=`<span class="face">${faces[i]}</span><span><span class="name">${names[i]}</span><br><span class="place">${p.finished?rank+'ばんめに ゴール！':p.pos+' マス'}</span></span>`;holder.append(d)});map.querySelectorAll('.token').forEach(e=>e.remove());players.forEach((p,i)=>{let t=document.createElement('div');t.className='token';t.textContent=faces[i];t.style.left=(x[p.pos]-20+(i%2?16:-16))+'px';t.style.top=(y[p.pos]-20+(i>1?16:-16))+'px';map.append(t)});document.getElementById('turn').textContent=players.length?`${faces[current]} ${names[current]}の ばん`:'じゅんびちゅう'}
function center(pos){wrap.scrollTo({left:Math.max(0,Math.min(x[pos]-wrap.clientWidth/2,2160-wrap.clientWidth)),behavior:'smooth'})}function start(){players=Array.from({length:count},()=>({pos:0,finished:false}));current=0;steps=0;pending=null;finishOrder=[];advance.disabled=true;document.getElementById('setup').classList.add('hidden');message.textContent=`${faces[0]} ${names[0]}の ばん。サイコロをふって！`;draw();center(0)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function roll(){if(rolling||!players.length)return;rolling=true;dice.disabled=true;for(let i=0;i<10;i++){dice.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];await sleep(80)}steps=Math.min(Math.floor(Math.random()*6)+1,24-players[current].pos);direction=1;dice.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][steps-1];message.textContent=`${steps} でた！ 「1マス すすむ」を タップしてね`;advance.textContent='1マス すすむ';advance.disabled=false}
function endTurn(){do{current=(current+1)%players.length}while(players[current].finished);message.textContent=`${faces[current]} ${names[current]}の ばん。サイコロをふって！`;draw();advance.disabled=true;dice.disabled=false;rolling=false}
function land(){let p=players[current];if(p.pos===24){reachGoal(current);return}if(event[p.pos]){pending=event[p.pos];let [icon,text,type,amount]=pending;message.textContent=`${icon} ${text} ${amount}マス ${type==='forward'?'すすむ':'もどる'}。タップしてね`;advance.textContent='イベントを すすめる';return}endTurn()}
function advanceStep(){if(!rolling)return;if(pending){let [icon,text,type,amount]=pending;pending=null;steps=amount;direction=type==='forward'?1:-1;advance.textContent=direction===1?'1マス すすむ':'1マス もどる';message.textContent=`${amount}マス ${direction===1?'すすむ':'もどる'}よ。タップしてね`;return}if(steps<=0)return;let p=players[current];p.pos=Math.max(0,Math.min(24,p.pos+direction));steps--;draw();center(p.pos);if(steps>0){message.textContent=`あと ${steps}マス。タップしてね`}else land()}
function reachGoal(i){players[i].finished=true;finishOrder.push(i);draw();advance.disabled=true;if(finishOrder.length<players.length){message.textContent=`${faces[i]} ${names[i]}が ${finishOrder.length}ばんめに ゴール！ まだまだ つづくよ`;setTimeout(endTurn,850);return}document.getElementById('winnerFace').textContent='🎉';document.getElementById('winnerTitle').textContent='みんな ゴール！';document.getElementById('winnerText').textContent=finishOrder.map((p,n)=>`${n+1}ばん ${faces[p]} ${names[p]}`).join('　');document.getElementById('finish').classList.remove('hidden');rolling=false}document.getElementById('choices').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;count=+b.dataset.count;document.querySelectorAll('#choices button').forEach(q=>q.classList.toggle('selected',q===b))});document.getElementById('begin').onclick=start;document.getElementById('again').onclick=()=>{document.getElementById('finish').classList.add('hidden');document.getElementById('setup').classList.remove('hidden')};dice.onclick=roll;advance.onclick=advanceStep;buildBoard();
</script></body></html>
